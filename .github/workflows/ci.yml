name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel:
    name: Laravel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: laravel
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          coverage: none
          extensions: bcmath, curl, intl, mbstring, pdo_sqlite
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.19"
          cache: npm
          cache-dependency-path: laravel/package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate dependencies
        run: |
          composer validate --strict
          composer audit --locked
          npm audit --audit-level=high

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

      - name: Build frontend
        run: npm run build

  openwa:
    name: OpenWA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: openwa
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.19"
          cache: npm
          cache-dependency-path: |
            openwa/package-lock.json
            openwa/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: |
          npm audit --omit=dev --omit=optional --audit-level=high
          npm audit --audit-level=critical
          npm --prefix dashboard audit --audit-level=high

      - name: Check source
        run: |
          npm run lint
          npm run format:check
          npm run check:versions

      - name: Build API and dashboard
        run: npm run build:all

      - name: Run API tests
        run: npm test -- --runInBand

      - name: Run dashboard checks
        run: |
          npm --prefix dashboard run lint
          npm --prefix dashboard run typecheck
          npm --prefix dashboard run test:unit

  containers:
    name: Containers and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize ephemeral environment
        run: ./infra/scripts/init-env.sh

      - name: Validate Compose files
        run: make compose-config

      - name: Run Laravel tests on PostgreSQL 16
        run: make test-postgres

      - name: Build production images
        run: docker compose --env-file infra/.env -f infra/compose.yml build gateway laravel openwa
