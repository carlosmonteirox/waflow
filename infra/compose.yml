name: waflow

x-laravel-build: &laravel-build
  context: ..
  dockerfile: infra/docker/laravel/Dockerfile
  target: app

x-laravel-volumes: &laravel-volumes
  - laravel-storage:/var/www/html/storage
  - ./secrets:/run/secrets:ro

x-laravel-environment: &laravel-environment
  APP_NAME: Waflow
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:-http://localhost:8080}
  APP_KEY: ${APP_KEY:?Run ./infra/scripts/init-env.sh before starting Waflow}
  APP_LOCALE: pt_BR
  APP_FALLBACK_LOCALE: pt_BR
  LOG_CHANNEL: stack
  LOG_STACK: stderr
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${POSTGRES_DB:-waflow}
  DB_USERNAME: ${POSTGRES_USER:-waflow}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Run ./infra/scripts/init-env.sh before starting Waflow}
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  SESSION_ENCRYPT: "true"
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  QUEUE_CONNECTION: redis
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  WAFLOW_API_REQUESTS_PER_MINUTE: ${WAFLOW_API_REQUESTS_PER_MINUTE:-120}
  WAFLOW_API_AUTH_ATTEMPTS_PER_IP: ${WAFLOW_API_AUTH_ATTEMPTS_PER_IP:-300}
  WAFLOW_API_AUTH_ATTEMPTS_PER_CREDENTIAL: ${WAFLOW_API_AUTH_ATTEMPTS_PER_CREDENTIAL:-120}
  WAFLOW_MESSAGE_WRITES_PER_MINUTE: ${WAFLOW_MESSAGE_WRITES_PER_MINUTE:-60}
  WAFLOW_BULK_REQUESTS_PER_MINUTE: ${WAFLOW_BULK_REQUESTS_PER_MINUTE:-10}
  WAFLOW_SENSITIVE_WRITES_PER_MINUTE: ${WAFLOW_SENSITIVE_WRITES_PER_MINUTE:-20}
  WAFLOW_MAX_BASE64_BYTES: ${WAFLOW_MAX_BASE64_BYTES:-10485760}
  WAFLOW_OPENWA_WEBHOOK_REQUESTS_PER_MINUTE: ${WAFLOW_OPENWA_WEBHOOK_REQUESTS_PER_MINUTE:-300}
  WAFLOW_INTER_WEBHOOK_REQUESTS_PER_MINUTE: ${WAFLOW_INTER_WEBHOOK_REQUESTS_PER_MINUTE:-60}
  WAFLOW_WEBHOOK_MAX_PAYLOAD_BYTES: ${WAFLOW_WEBHOOK_MAX_PAYLOAD_BYTES:-1048576}
  OPENWA_URL: http://openwa:2785
  OPENWA_API_KEY: ${OPENWA_MASTER_KEY:?Run ./infra/scripts/init-env.sh before starting Waflow}
  OPENWA_WEBHOOK_URL: http://gateway/api/v1/internal/openwa/events
  OPENWA_WEBHOOK_SECRET: ${OPENWA_WEBHOOK_SECRET:?Run ./infra/scripts/init-env.sh before starting Waflow}
  BILLING_DRIVER: ${BILLING_DRIVER:-inter}
  BILLING_CURRENCY: ${BILLING_CURRENCY:-BRL}
  BILLING_CHECKOUT_TTL_MINUTES: ${BILLING_CHECKOUT_TTL_MINUTES:-30}
  BILLING_PAYMENT_METHODS: ${BILLING_PAYMENT_METHODS:-pix}
  INTER_ENVIRONMENT: ${INTER_ENVIRONMENT:-sandbox}
  INTER_CLIENT_ID: ${INTER_CLIENT_ID:-}
  INTER_CLIENT_SECRET: ${INTER_CLIENT_SECRET:-}
  INTER_CERTIFICATE_PATH: ${INTER_CERTIFICATE_PATH:-/run/secrets/inter.crt}
  INTER_PRIVATE_KEY_PATH: ${INTER_PRIVATE_KEY_PATH:-/run/secrets/inter.key}
  INTER_CERTIFICATE_PASSPHRASE: ${INTER_CERTIFICATE_PASSPHRASE:-}
  INTER_PRIVATE_KEY_PASSPHRASE: ${INTER_PRIVATE_KEY_PASSPHRASE:-}
  INTER_ACCOUNT: ${INTER_ACCOUNT:-}
  INTER_WEBHOOK_SECRET: ${INTER_WEBHOOK_SECRET:?Run ./infra/scripts/init-env.sh before starting Waflow}
  INTER_WEBHOOK_URL: ${INTER_WEBHOOK_URL:-}
  INTER_RECEIVER_NAME: ${INTER_RECEIVER_NAME:-}
  INTER_RECEIVER_CNPJ: ${INTER_RECEIVER_CNPJ:-}
  INTER_RECEIVER_AGENCY: ${INTER_RECEIVER_AGENCY:-}
  INTER_RECEIVER_ACCOUNT: ${INTER_RECEIVER_ACCOUNT:-}
  INTER_RECEIVER_ACCOUNT_TYPE: ${INTER_RECEIVER_ACCOUNT_TYPE:-CORRENTE}
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_LOG_CHANNEL: ${MAIL_LOG_CHANNEL:-mail}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@waflow.local}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Waflow}

services:
  gateway:
    build:
      context: ..
      dockerfile: infra/docker/laravel/Dockerfile
      target: web
    image: waflow/gateway:${WAFLOW_VERSION:-local}
    restart: unless-stopped
    ports:
      - "${WAFLOW_HTTP_PORT:-8080}:80"
    depends_on:
      laravel:
        condition: service_healthy
    networks:
      - public
      - private
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 5

  laravel:
    build: *laravel-build
    image: waflow/laravel:${WAFLOW_VERSION:-local}
    restart: unless-stopped
    init: true
    environment: *laravel-environment
    volumes: *laravel-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      openwa:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - public
      - private
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 15s
      timeout: 5s
      retries: 5

  migrate:
    build: *laravel-build
    image: waflow/laravel:${WAFLOW_VERSION:-local}
    restart: "no"
    environment: *laravel-environment
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    volumes: *laravel-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - private

  worker:
    build: *laravel-build
    image: waflow/laravel:${WAFLOW_VERSION:-local}
    restart: unless-stopped
    init: true
    environment: *laravel-environment
    command:
      [
        "php",
        "artisan",
        "queue:work",
        "--sleep=3",
        "--tries=3",
        "--timeout=90",
        "--no-interaction",
      ]
    stop_grace_period: 45s
    volumes: *laravel-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - private
      - egress

  scheduler:
    build: *laravel-build
    image: waflow/laravel:${WAFLOW_VERSION:-local}
    restart: unless-stopped
    init: true
    environment: *laravel-environment
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    volumes: *laravel-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - private
      - egress

  openwa:
    build:
      context: ../openwa
      dockerfile: Dockerfile
    image: waflow/openwa:${WAFLOW_VERSION:-local}
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    environment:
      NODE_ENV: production
      PORT: 2785
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
      XDG_CACHE_HOME: /tmp/.cache
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-waflow}
      DATABASE_USERNAME: ${POSTGRES_USER:-waflow}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Run ./infra/scripts/init-env.sh before starting Waflow}
      POSTGRES_SCHEMA: openwa
      DATABASE_SYNCHRONIZE: "false"
      MAIN_DATABASE_SYNCHRONIZE: "true"
      ENGINE_TYPE: baileys
      BAILEYS_AUTH_ENCRYPTION_KEY: ${BAILEYS_AUTH_ENCRYPTION_KEY:?Run ./infra/scripts/init-env.sh before starting Waflow}
      BAILEYS_BROWSER_NAME: Waflow
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/data/media
      PLUGINS_DIR: /app/data/plugins
      SSRF_ALLOWED_HOSTS: gateway
      API_MASTER_KEY: ${OPENWA_MASTER_KEY:?Run ./infra/scripts/init-env.sh before starting Waflow}
      ENABLE_SWAGGER: "false"
    volumes:
      - openwa-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - private
      - egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
    shm_size: 1gb
    pids_limit: ${OPENWA_PIDS_LIMIT:-2048}
    mem_limit: ${OPENWA_MEM_LIMIT:-2g}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:2785/api/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 45s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-waflow}
      POSTGRES_USER: ${POSTGRES_USER:-waflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./infra/scripts/init-env.sh before starting Waflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/01-openwa-schema.sh:/docker-entrypoint-initdb.d/01-openwa-schema.sh:ro
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  laravel-storage:
  openwa-data:
  postgres-data:
  redis-data:

networks:
  public:
  egress:
  private:
    internal: true
